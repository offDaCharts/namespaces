name: macOS CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Clean build and tests
        run: swift package clean && swift test
      - name: Package app
        run: ./Scripts/build-app.sh release
      - name: Verify packaged MCP protocol
        run: python3 Scripts/test-mcp.py build/DeskOrbit.app/Contents/MacOS/DeskOrbit
      - name: Verify live MCP and explicit headless fallback
        run: python3 Scripts/test-mcp.py build/DeskOrbit.app/Contents/MacOS/DeskOrbit --launch-app --apply-round-trip --allow-headless-fallback
      - name: Archive self-contained app
        run: ditto -c -k --sequesterRsrc --keepParent build/DeskOrbit.app build/DeskOrbit-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DeskOrbit-macos-universal
          path: build/DeskOrbit-macos-universal.zip
      - name: Verify signature and privacy policy
        run: |
          codesign --verify --deep --strict build/DeskOrbit.app
          test ! -d build/DeskOrbit.app/Contents/Frameworks
          test ! -d build/DeskOrbit.app/Contents/XPCServices
          test "$(find build/DeskOrbit.app/Contents/MacOS -type f | wc -l | tr -d ' ')" = "1"
          ! rg 'TelemetryClient|SentrySDK|FirebaseAnalytics|Amplitude|Mixpanel' Sources Package.swift
  tahoe-launch-smoke-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained app on Tahoe
        run: ./Scripts/build-app.sh release
      - name: Verify MCP protocol on Tahoe
        run: python3 Scripts/test-mcp.py build/DeskOrbit.app/Contents/MacOS/DeskOrbit
      - name: Verify live MCP on Tahoe
        run: python3 Scripts/test-mcp.py build/DeskOrbit.app/Contents/MacOS/DeskOrbit --launch-app --apply-round-trip --allow-headless-fallback
      - name: Verify Tahoe launch reaches visible-UI startup
        run: |
          rm -f "$HOME/Library/Logs/DeskOrbit/launch.log"
          open build/DeskOrbit.app
          for attempt in {1..20}; do
            if grep -q 'primary UI presentation completed' "$HOME/Library/Logs/DeskOrbit/launch.log" 2>/dev/null; then
              pgrep -x DeskOrbit
              pkill -x DeskOrbit
              exit 0
            fi
            sleep 1
          done
          cat "$HOME/Library/Logs/DeskOrbit/launch.log" 2>/dev/null || true
          exit 1
