name: macOS CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Clean build and tests
        run: swift package clean && swift test
      - name: Package app
        run: ./Scripts/build-app.sh release
      - name: Archive self-contained app
        run: ditto -c -k --sequesterRsrc --keepParent build/Namespaces.app build/Namespaces-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Namespaces-macos-universal
          path: build/Namespaces-macos-universal.zip
      - name: Verify signature and offline policy
        run: |
          codesign --verify --deep --strict build/Namespaces.app
          ! rg 'URLSession|NWConnection|TelemetryClient|SentrySDK|Analytics' Sources Package.swift
