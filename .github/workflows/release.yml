name: Publish macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift package clean && swift test
      - name: Build self-contained universal release
        run: ./Scripts/release.sh
      - name: Verify artifacts
        run: |
          hdiutil verify build/release/Namespaces-*.dmg
          unzip -t build/release/Namespaces-*-macos-universal.zip
          (cd build/release && shasum -a 256 -c SHA256SUMS.txt)
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
            tag="v${version}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/release/Namespaces-*.dmg build/release/Namespaces-*-macos-universal.zip build/release/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" build/release/Namespaces-*.dmg build/release/Namespaces-*-macos-universal.zip build/release/SHA256SUMS.txt --title "Namespaces ${tag#v}" --generate-notes
          fi
