name: Publish macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Import Developer ID certificate
        env:
          DESKORBIT_DEVELOPER_ID_P12_BASE64: ${{ secrets.DESKORBIT_DEVELOPER_ID_P12_BASE64 }}
          DESKORBIT_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DESKORBIT_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/deskorbit-developer-id.p12"
          keychain_path="$RUNNER_TEMP/deskorbit-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$DESKORBIT_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$DESKORBIT_DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
      - name: Prepare notarization and Sparkle keys
        env:
          DESKORBIT_NOTARY_KEY_BASE64: ${{ secrets.DESKORBIT_NOTARY_KEY_BASE64 }}
          DESKORBIT_SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.DESKORBIT_SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          echo "$DESKORBIT_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_DeskOrbit.p8"
          echo "$DESKORBIT_SPARKLE_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/deskorbit-sparkle-private-key"
          chmod 600 "$RUNNER_TEMP/AuthKey_DeskOrbit.p8" "$RUNNER_TEMP/deskorbit-sparkle-private-key"
      - name: Test
        run: swift package clean && swift test
      - name: Build self-contained universal release
        env:
          DESKORBIT_SIGN_IDENTITY: "Developer ID Application: Kauibungalow LLC (Q3T7CAZ6NT)"
          DESKORBIT_NOTARY_KEY: ${{ runner.temp }}/AuthKey_DeskOrbit.p8
          DESKORBIT_NOTARY_KEY_ID: ${{ secrets.DESKORBIT_NOTARY_KEY_ID }}
          DESKORBIT_NOTARY_ISSUER: ${{ secrets.DESKORBIT_NOTARY_ISSUER }}
          DESKORBIT_SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/deskorbit-sparkle-private-key
        run: ./Scripts/release.sh
      - name: Verify artifacts
        run: |
          hdiutil verify build/release/DeskOrbit-*.dmg
          unzip -t build/release/DeskOrbit-*-macos-universal.zip
          (cd build/release && shasum -a 256 -c SHA256SUMS.txt)
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
            tag="v${version}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/release/DeskOrbit-*.dmg build/release/DeskOrbit-*-macos-universal.zip build/release/SHA256SUMS.txt build/release/appcast.xml --clobber
          else
            gh release create "$tag" build/release/DeskOrbit-*.dmg build/release/DeskOrbit-*-macos-universal.zip build/release/SHA256SUMS.txt build/release/appcast.xml --title "DeskOrbit ${tag#v}" --generate-notes
          fi
